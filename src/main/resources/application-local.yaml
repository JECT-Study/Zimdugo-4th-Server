spring:
  config:
    activate:
      on-profile: local

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-client-secret}
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zimdugo}
    username: ${DB_USERNAME:zimdugo}
    password: ${DB_PASSWORD:zimdugo}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      separator: ';;'
      data-locations:
        - file:scripts/db/01-postgis.sql

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    com.zimdugo: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

auth:
  callback:
    frontend-base-url: http://localhost:3000
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
    cookie-secure: false
  cookie:
    refresh:
      secure: false
      same-site: Strict

visitor:
  cookie:
    secure: false

push:
  device:
    cookie-secure: false
  vapid:
    public-key: ${PUSH_VAPID_PUBLIC_KEY:BGgL7I82SAQM78oyGwaJdrQFhVfZqL9h4Y18BLtgJQ-9pSGXwxqAWQudqmcv41RcWgk1ssUeItv4-8khxbhYveM=}
    private-key: ${PUSH_VAPID_PRIVATE_KEY:ANlfcVVFB4JiMYcI74_h9h04QZ1Ks96AyEa1yrMgDwn3}
    subject: ${PUSH_VAPID_SUBJECT:mailto:admin@zimdugo.com}
