<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>보관함 신고 관리</title>
</head>
<body>
<main>
    <style>
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th {
            padding: 0.75rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e5e5e5;
            text-align: left;
        }
        .admin-table td {
            padding: 0.85rem 1rem;
            font-size: 0.9rem;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: top;
        }
        .title-link {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 600;
        }
        .title-link:hover { color: #4f46e5; text-decoration: underline; }
        .muted { color: #888; font-size: 0.82rem; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #999; }
        .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .locker-line { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
        .deleted-badge {
            display: inline-flex;
            align-items: center;
            padding: .18rem .5rem;
            border-radius: 999px;
            background: #fff7ed;
            color: #c2410c;
            font-size: .75rem;
            font-weight: 600;
        }
    </style>

    <div class="page-header">
        <div>
            <div class="page-header type-label">LOCKER ISSUE REPORTS</div>
            <h1>보관함 신고 관리</h1>
        </div>
    </div>

    <div class="card">
        <div class="filter-row">
            <a class="btn btn-secondary btn-sm"
               th:classappend="${selectedStatus == null} ? ' btn-primary'"
               th:href="@{/admin/locker-issue-reports}">
                전체
            </a>
            <a class="btn btn-secondary btn-sm"
               th:each="status : ${statuses}"
               th:classappend="${selectedStatus == status.code} ? ' btn-primary'"
               th:href="@{/admin/locker-issue-reports(status=${status.code})}"
               th:text="${status.displayName}">
                접수
            </a>
        </div>

        <table class="admin-table" th:if="${not #lists.isEmpty(reports)}">
            <thead>
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th>대상 보관함</th>
                    <th style="width: 180px;">신고 유형</th>
                    <th style="width: 130px;">상태</th>
                    <th style="width: 160px;">등록일시</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="report : ${reports}">
                    <td class="muted" th:text="${report.id}">1</td>
                    <td>
                        <div class="locker-line">
                            <a class="title-link"
                               th:href="@{/admin/locker-issue-reports/{id}(id=${report.id})}"
                               th:text="${report.lockerName}">
                                보관함 이름
                            </a>
                            <span class="deleted-badge" th:if="${report.lockerDeleted}">삭제됨</span>
                        </div>
                        <div class="muted" th:if="${report.lockerDeleted}">삭제된 보관함에 대한 신고 이력입니다.</div>
                        <div class="muted" th:text="'lockerId: ' + ${report.lockerId}">lockerId</div>
                        <div class="muted" th:text="${report.lockerRoadAddress} ?: '-'">주소</div>
                    </td>
                    <td>
                        <div th:text="${report.reportType.name()}">WRONG_LOCATION</div>
                        <div class="muted"
                             th:text="${report.detail != null and !report.detail.isBlank()} ? ${report.detail} : '상세 내용 없음'">
                            상세 내용
                        </div>
                    </td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${'status-' + #strings.toLowerCase(report.status.name())}"
                              th:text="${report.status.displayName()}">
                            접수
                        </span>
                    </td>
                    <td class="muted" th:text="${#temporals.format(report.createdAt, 'yyyy-MM-dd HH:mm')}">
                        2026-08-20 23:00
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="empty-state" th:if="${#lists.isEmpty(reports)}">
            <p>조건에 맞는 보관함 신고가 없습니다.</p>
        </div>
    </div>
</main>
</body>
</html>
